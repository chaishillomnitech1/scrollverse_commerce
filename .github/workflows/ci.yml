name: CI - Install and Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  install-and-test:
    name: Install Dependencies and Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format remaining CI-reported files for repair review
        run: pnpm exec prettier --write docs/SCROLLVERSE_DIRECT_CUSTOMER_MIRROR.md README.md

      - name: Verify formatted files
        run: pnpm exec prettier --check docs/SCROLLVERSE_DIRECT_CUSTOMER_MIRROR.md README.md

      - name: Upload formatted repair files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-repair-followup-${{ github.run_id }}-${{ matrix.node-version }}
          path: |
            docs/SCROLLVERSE_DIRECT_CUSTOMER_MIRROR.md
            README.md
          retention-days: 1

      - name: Run tests
        run: pnpm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
